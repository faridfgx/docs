<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetLab 2.0 – مختبر تعلّم الشبكات</title>
<style>
*{box-sizing:border-box}
:root{--bg:#eaf0f7;--pn:#fff;--ln:#d5deea;--tx:#0e1a2b;--mu:#60708a;--ac:#1f6feb;--ok:#12a150;--bd:#d92d3a;--cv:#f4f7fb;--grid:#cfd9e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d18;--pn:#0f1829;--ln:#223250;--tx:#e7eefb;--mu:#8da0c0;--ac:#4d94ff;--ok:#2fd18b;--bd:#ff6b78;--cv:#0a1222;--grid:#17253f}}
:root[data-theme="dark"]{--bg:#070d18;--pn:#0f1829;--ln:#223250;--tx:#e7eefb;--mu:#8da0c0;--ac:#4d94ff;--ok:#2fd18b;--bd:#ff6b78;--cv:#0a1222;--grid:#17253f}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,-apple-system,Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#1f6feb,#8b5cf6);display:grid;place-items:center;color:#fff}
.brand small{display:block;font-weight:500;color:var(--mu);font-size:11.5px;margin-top:-2px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--pn);color:var(--tx);padding:7px 12px;border-radius:9px}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.danger{color:var(--bd)}
main{flex:1;display:flex;min-height:0}
#pal{width:124px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--pn);border-inline-end:1px solid var(--ln);overflow:auto;flex:none}
.pi{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:1px solid var(--ln);border-radius:12px;color:var(--c);cursor:grab;touch-action:none;user-select:none;background:var(--bg);font-size:11.5px;flex:none}
.pi span{color:var(--tx);text-align:center;font-weight:600}.pi:hover{border-color:var(--c)}.pi.on{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}.psep{flex:none;font-size:10.5px;color:var(--mu);font-weight:700;text-align:center;align-self:center}
#cv{flex:1;position:relative;overflow:hidden;background-color:var(--cv);background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:22px 22px;min-width:0}
#cv.cab{cursor:crosshair}
#ln,#pk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lk{stroke-width:3.5;stroke-linecap:round}
.lk.eth{stroke:var(--ac)}.lk.usb{stroke:var(--mu);stroke-dasharray:2 7}
.lk.wifi{stroke:#a855f7;stroke-dasharray:6 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-12}}
@media(prefers-reduced-motion:reduce){.lk.wifi{animation:none}}
.lk.hot{stroke:var(--ok);stroke-width:6;filter:drop-shadow(0 0 6px var(--ok))}
.hit{stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.rng{fill:rgba(168,85,247,.07);stroke:#a855f7;stroke-dasharray:4 6;opacity:.7}
.node{position:absolute;transform:translate(-50%,-50%);width:96px;text-align:center;cursor:grab;touch-action:none;user-select:none}
.node .ic{position:relative;width:62px;height:62px;margin:auto;display:grid;place-items:center;border-radius:16px;background:var(--pn);border:1.5px solid var(--ln);color:var(--c);box-shadow:0 6px 18px rgba(8,20,45,.15)}
.node.sel .ic{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 28%,transparent)}
.node.pend .ic{border-color:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 30%,transparent)}
.nm{font-weight:600;font-size:12px;margin-top:5px}
.ip{font-size:11px;color:var(--mu);font-family:ui-monospace,Menlo,monospace;min-height:14px}
.dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--pn);background:var(--mu)}
.dot.on{background:var(--ok)}.dot.lim{background:#f59e0b}
.bdg{position:absolute;bottom:-7px;left:-8px;font-size:9.5px;padding:1px 6px;border-radius:8px;background:var(--ac);color:#fff;font-weight:600}
.bdg.w{left:auto;right:-10px;background:#a855f7}
#hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mu);pointer-events:none;padding:20px}
#hint div{max-width:340px}#hint b{display:block;font-size:18px;color:var(--tx);margin-bottom:6px}
#hint button{pointer-events:auto;margin-top:12px}
#ins{width:300px;padding:14px;background:var(--pn);border-inline-start:1px solid var(--ln);overflow-y:auto;flex:none}
#ins h4{margin:16px 0 6px;font-size:13px}
.ih{display:flex;gap:10px;align-items:center}.ih .ic{color:var(--c)}
.ih input{font-weight:700;font-size:15px;width:100%}
.ih small{color:var(--mu)}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;width:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:12px;font-size:13px}
.kv span:nth-child(odd){color:var(--mu)}.kv span:nth-child(even){text-align:left;unicode-bidi:plaintext;font-family:ui-monospace,Menlo,monospace}
.note{background:var(--bg);border:1px dashed var(--ln);border-radius:10px;padding:10px;color:var(--mu);font-size:12.5px;margin-top:8px}
.ap{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border:1px solid var(--ln);border-radius:10px;margin-bottom:6px;cursor:pointer}
.ap:hover{border-color:#a855f7}
.bars{display:inline-flex;gap:2px;align-items:flex-end;margin-inline-start:8px}.bars i{width:4px;background:var(--ln);border-radius:1px}.bars i.f{background:#a855f7}
.row{display:flex;gap:6px;margin-top:6px}.row button{flex:none}
.err{color:var(--bd);font-size:12.5px;margin-top:4px}
.guide{padding-inline-start:18px;margin:8px 0;color:var(--mu)}.guide li{margin-bottom:6px}.guide b{color:var(--tx)}
#log{height:104px;overflow:auto;padding:8px 14px;background:var(--pn);border-top:1px solid var(--ln);font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--mu);flex:none}
#log i{opacity:.6;font-style:normal;margin-right:8px}#log .ok{color:var(--ok)}#log .bad{color:var(--bd)}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1}header{background:linear-gradient(90deg,var(--pn),color-mix(in srgb,var(--ac) 9%,var(--pn)))}.node .ic{background:linear-gradient(160deg,var(--pn),color-mix(in srgb,var(--c) 14%,var(--pn)))}.lk.eth{filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}.node:focus-visible{outline:0}.node:focus-visible .ic,.pi:focus-visible{outline:3px solid var(--ac);outline-offset:3px}.hl{animation:pl 1.3s ease-in-out infinite}.node.hl .ic,.pi.hl,button.hl,input.hl,.ap.hl{box-shadow:0 0 0 3px #f59e0b,0 0 22px #f59e0b}@keyframes pl{50%{filter:brightness(1.3)}}@media(prefers-reduced-motion:reduce){.hl{animation:none}}.dot{width:17px;height:17px;top:-6px;right:-6px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;line-height:1}.mc{background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 10%,var(--pn)),var(--pn));border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:14px}.mh{display:flex;align-items:center;gap:8px}.lvb{font-size:11.5px;font-weight:700;background:var(--ac);color:#fff;border-radius:7px;padding:2px 8px}.pg{display:flex;gap:4px;margin:10px 0}.pg i{flex:1;height:5px;border-radius:3px;background:var(--ln)}.pg i.f{background:var(--ok)}.pg i.c{background:var(--ac)}.st{list-style:none;padding:0;margin:8px 0}.st li{display:flex;gap:8px;padding:5px 0;color:var(--mu)}.st li.c{color:var(--tx);font-weight:600}.st li.d{text-decoration:line-through}.ck{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ln);display:grid;place-items:center;font-size:11px}.st .c .ck{border-color:var(--ac);color:var(--ac)}.st .d .ck{background:var(--ok);border-color:var(--ok);color:#fff}.help{background:var(--bg);border-left:3px solid var(--ac);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--mu);margin-bottom:8px}.win{background:color-mix(in srgb,var(--ok) 15%,var(--pn));border:1px solid var(--ok);border-radius:10px;padding:10px;margin-bottom:8px}#mb{position:absolute;left:12px;right:12px;top:12px;z-index:5;background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px}#mb[hidden]{display:none}#mb button{padding:4px 10px;background:transparent;color:inherit;border-color:currentColor}select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px;min-width:0}
.ghost{position:fixed;transform:translate(-50%,-50%);pointer-events:none;color:var(--c);z-index:99;opacity:.9;background:var(--pn);border:1.5px solid var(--c);border-radius:14px;padding:8px}
@media(max-width:860px){
html,body{height:auto}#app{height:auto;min-height:100vh}
main{flex-direction:column}
#pal{width:auto;flex-direction:row;border-inline-end:0;border-bottom:1px solid var(--ln)}.pi{width:84px}
#cv{flex:none;height:62vh}
#ins{width:auto;border-inline-start:0;border-top:1px solid var(--ln)}}
body.big{font-size:17px}body.big .ip{font-size:14px}body.big .nm{font-size:15px}body.big .pi{font-size:14px}body.big #log{font-size:15px;height:130px}.ip,#pt,#rp,#wp{direction:ltr}#pt{text-align:left}.pop{position:fixed;top:70px;left:50%;transform:translateX(-50%);width:min(470px,94vw);max-height:62vh;overflow:auto;background:var(--pn);border:1.5px solid var(--ln);border-radius:12px;box-shadow:0 12px 40px #0006;z-index:30}.dkt{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--ac);color:#fff;border-radius:10px 10px 0 0}.dkt button{background:none;border:0;color:#fff;font-size:16px;padding:2px 8px}.dkb2{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--ln);flex-wrap:wrap}.dkb2 .on{outline:2px solid var(--ac)}.dkc{padding:10px}#co{direction:ltr;text-align:left;background:#0b1220;color:#9fe3b4;padding:8px;border-radius:8px;min-height:80px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;margin:8px 0 0}.stk{background:#fff8c5;color:#3a3000;border:1px dashed #b59b00;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:12.5px;line-height:1.8}.stk code{direction:ltr;unicode-bidi:embed;font-weight:700}#rst{position:relative;overflow:hidden;width:100%}#rst:after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:0;background:#d92d3a66}#rst.hold:after{width:100%;transition:width 2.5s linear}.dkt{cursor:move;touch-action:none;user-select:none}#cp{top:90px;width:min(560px,94vw);z-index:36}#ip{top:100px;width:min(520px,94vw);z-index:34}#ip img{max-width:100%;border-radius:10px;display:block;margin:auto}.cch{display:block;width:100%;text-align:start;margin-bottom:6px}.cch span{display:block;color:var(--mu);font-size:12.5px;font-weight:400;margin-top:2px}.cch small{color:var(--ac);margin-inline-start:6px}.cch.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--pn))}.goal{background:color-mix(in srgb,var(--ac) 10%,var(--pn));border:1.5px solid var(--ac);border-radius:10px;padding:9px 11px;margin:8px 0;font-size:13px}.sub{color:var(--mu);font-size:12px;font-weight:600;margin:6px 0 2px}
.pwd{position:absolute;bottom:-5px;left:-5px;width:14px;height:14px;border-radius:50%;border:2px solid var(--pn);background:#22c55e;box-shadow:0 0 0 1px rgba(0,0,0,.18)}.pwd.r{background:#ef4444}.node.pwoff .ic svg,.node.pwoff .nm{opacity:.5}

/* NetLab 2.0 learning layer */
.lesson{border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 7%,var(--pn));border-radius:12px;padding:11px;margin:9px 0}
.lesson h3{margin:0 0 6px;font-size:15px}.lesson p{margin:5px 0;color:var(--mu);font-size:12.5px}.lesson .tip{background:var(--bg);padding:8px;border-radius:8px;margin:7px 0;font-size:12px}
.lessonbar{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}.lessonbar button{font-size:12px}
#glossary{z-index:45;width:min(620px,95vw);max-height:78vh}#glossary .dkc{max-height:65vh;overflow:auto}
.gsearch{margin:5px 0 10px}.gitem{padding:9px;border-bottom:1px solid var(--ln)}.gitem b{display:block}.gitem small{color:var(--ac);font-weight:600}.gitem p{margin:3px 0;color:var(--mu);font-size:12.5px}
#packetHelp{position:absolute;z-index:8;bottom:12px;left:12px;right:12px;max-width:560px;margin:auto;background:var(--pn);border:1px solid var(--ac);box-shadow:0 6px 24px #0002;border-radius:12px;padding:10px 12px;font-size:12px}
#packetHelp[hidden]{display:none}#packetHelp b{color:var(--ac)}#packetHelp .steps{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}#packetHelp .steps span{background:var(--bg);border-radius:7px;padding:4px 7px}
#toast{white-space:normal;max-width:min(560px,92vw);line-height:1.55}
@media(max-width:860px){#packetHelp{bottom:8px}}
</style></head><body>
<div id="app">
<header>
<div class="brand"><i><svg width="18" height="18" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><circle cx="24" cy="10" r="5"/><circle cx="10" cy="38" r="5"/><circle cx="38" cy="38" r="5"/><path d="M24 15v10M24 25L12 34M24 25l12 9"/></svg></i><div>NetLab<small>ابنِ شبكة محلية وجرّبها</small></div></div>
<div class="tools"><button id="bSel" class="on">تحريك</button><button id="bMd" onclick="openCp()"> التحديات</button><button onclick="openGlossary()"> قاموس الشبكات</button><button id="bEx">تحميل مثال</button><button id="bBig" onclick="document.body.classList.toggle('big')">عرض كبير</button><button id="bClr" class="danger">مسح</button></div>
</header>
<main>
<aside id="pal" aria-label="صندوق الأجهزة"></aside>
<section id="cv"><svg id='ln'></svg><svg id='pk'></svg><div id='nodes'></div><div id='mb' hidden></div>
<div id="hint"><div><b>اسحب الأجهزة إلى هنا لتبدأ</b>اختر راوتراً ومحوّلاً وبعض الحواسيب من صندوق الأجهزة ثم صِلها بالكبلات أو الواي فاي.<br></div></div></section>
<aside id='ins'><div id='ms'></div><div id='ib'></div></aside>
</main>
<div id='log' role='log' aria-live='polite'></div></div>
<div id="ip" class="pop" hidden role="dialog" aria-label="صورة الجهاز"><div class="in"></div></div><div id="cp" class="pop" hidden role="dialog" aria-label="اختيار الوضع"><div class="in"></div></div><div id="dk" class="pop" hidden role="dialog" aria-label="سطح المكتب"><div class="in"></div></div><div id="glossary" class="pop" hidden role="dialog" aria-label="قاموس الشبكات"><div class="in"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=340,cv=$('#cv');
const IC={pc:'<rect x="7" y="7" width="34" height="23" rx="3"/><path d="M18 41h12M24 30v11"/>',
laptop:'<rect x="11" y="9" width="26" height="19" rx="2"/><path d="M4 35h40l-4 4H8z"/>',
switch:'<rect x="4" y="17" width="40" height="15" rx="3"/><path d="M11 25h1M18 25h1M25 25h1M32 25h1M39 25h1" stroke-width="4"/>',
hub:'<circle cx="24" cy="24" r="12"/><circle cx="24" cy="24" r="3"/><path d="M24 12V5M24 36v7M12 24H5M36 24h7"/>',
router:'<rect x="5" y="26" width="38" height="13" rx="3"/><path d="M13 26L9 9M35 26l4-17M16 33h1M22 33h1M28 33h1" stroke-width="3"/>',
printer:'<path d="M14 18V7h20v11M14 34H8V19h32v15h-6"/><rect x="14" y="28" width="20" height="13" rx="1"/>',
nprinter:'<path d="M14 18V7h20v11M14 34H8V19h32v15h-6"/><rect x="14" y="28" width="20" height="13" rx="1"/><circle cx="41" cy="9" r="3"/>',
nic:'<rect x="17" y="24" width="14" height="19" rx="2"/><path d="M21 24v-5h6v5M12 11a17 17 0 0 1 24 0M17 16a10 10 0 0 1 14 0"/>'};

function segs(p){const s=[];let c=[];p.forEach((id,i)=>{c.push(id);if(i>0&&i<p.length-1&&get(id).t=='router'){s.push(c);c=[id]}});s.push(c);return s}
function l2learn(p){let fl=0;segs(p.filter(i=>get(i).t!='net')).forEach(s=>{if(s.length<2)return;const A=get(s[0]),B=get(s[s.length-1]);A.arp=A.arp||{};B.arp=B.arp||{};
if(A.ip&&B.ip&&A.arp[B.ip]!=B.mac){A.arp[B.ip]=B.mac;B.arp[A.ip]=A.mac;fl=1}
s.forEach((id,i)=>{const n=get(id);if(n.t=='switch'){n.mt=n.mt||{};n.mt[A.mac]=s[i-1];n.mt[B.mac]=s[i+1]}})});return fl}
function reach(a,b){
if(a.on===false)return{e:'aoff'};if(b.on===false)return{e:'boff'};if(!a.ip)return{e:'noip'};
const da=bfs(a.id);
if(b.t!='net'&&same(a.ip,a.mask,b.ip)){const p=pth(da,b.id);return p?{p}:{e:'nol2'}}
const isR=a.t=='router'&&!a.dup;
if(!isR&&!a.gw)return{e:'nogw'};
const R=isR?a:D.find(r=>r.t=='router'&&r.ip==a.gw&&da.has(r.id));
if(!R)return{e:'badgw'};
const lk=(x,y)=>L.some(l=>l.k=='eth'&&((l.a==x&&l.b==y)||(l.a==y&&l.b==x)));
const goal=r=>b.t=='net'?lk(r.id,b.id):(!r.dup&&same(r.ip,'255.255.255.0',b.ip)&&bfs(r.id).has(b.id));
const prev=new Map([[R.id,null]]),q=[R.id];let T=null;
while(q.length){const n=q.shift();if(goal(get(n))){T=n;break}
L.forEach(l=>{if(l.k!='eth')return;const o=l.a==n?l.b:l.b==n?l.a:null;if(o!=null&&get(o).t=='router'&&!prev.has(o)){prev.set(o,n);q.push(o)}})}
if(T==null)return{e:'nort'};
let p=pth(da,R.id).concat(pth(prev,T).slice(1));
if(b.t=='net')p.push(b.id);else p=p.concat(pth(bfs(T),b.id).slice(1));
return{p}}

noip:`${d.name}: لا يوجد رابط (لا كبل ولا واي فاي)`,
nol2:`Ping ${t.ip}: الوجهة تقع في شبكتك حسب القناع، لكن لا يوجد مسار فعلي. افحص الكبلات أو الواي فاي`,
nogw:t.t=='net'?(d.st=='lim'?'لا DHCP ولا بوابة: وصّل الراوتر':'لا بوابة: لا يُبلغ الإنترنت إلا عبر راوتر'):`Ping ${t.ip}: الوجهة خارج شبكتك (${d.ip} / ${d.mask}) ولا توجد بوابة مضبوطة`,
badgw:`Ping ${t.ip}: الوجهة خارج شبكتك والبوابة ${d.gw} لا تردّ: ليست راوتراً في شبكتك. راجع عنوان البوابة`,
nort:t.t=='net'?'الراوتر لا يملك طريقاً إلى الإنترنت: وصّل «الإنترنت» بالراوتر':`Ping ${t.ip}: الراوتر لا يعرف طريقاً إلى تلك الشبكة. صِل الراوترين بكبل مباشر`})[e]}

const LESSONS={
'أول اتصال':['ما هي الشبكة؟','الشبكة مجموعة أجهزة متصلة لتبادل البيانات والموارد. يمكن أن يكون الاتصال سلكياً أو لاسلكياً.','ابدأ بجهازين وكبل، ثم اختبر هل يستطيع أحدهما الوصول إلى الآخر.'],
'إضافة محوّل':['لماذا نحتاج إلى محوّل؟','المحوّل (Switch) يربط عدة أجهزة داخل الشبكة المحلية، ويتعلم عناوين MAC ليوجه الإطارات إلى المنفذ المناسب.','لاحظ كيف يتصل كل حاسوب بمنفذ مختلف في المحوّل.'],

'أساسيات عناوين IP':['ما هو عنوان IP؟','عنوان IPv4 يتكون من أربعة أرقام تفصل بينها نقاط، مثل 192.168.1.10. يستخدمه الجهاز للتعريف بعنوانه على شبكة IP.','في هذا الدرس ستستخدم عنوانين مختلفين ضمن الشبكة 192.168.1.0/24.'],
'الراوتر وDHCP':['كيف يحصل الجهاز على إعداداته تلقائياً؟','DHCP يوزع إعدادات الشبكة مثل عنوان IP وقناع الشبكة والبوابة الافتراضية، بدلاً من إدخالها يدوياً على كل جهاز.','راقب العنوان الذي يحصل عليه الحاسوب بعد الاتصال بالراوتر.'],
'الاتصال بالإنترنت':['ما الفرق بين الشبكة المحلية والإنترنت؟','الشبكة المحلية تربط أجهزتك القريبة. الراوتر يمرر البيانات بين شبكتك وشبكات أخرى، ومنها الإنترنت.','تابع المسار من الحاسوب إلى الراوتر ثم إلى نقطة الإنترنت المحاكية.'],
'مشاركة الطابعات':['كيف تعمل الطابعة عبر الشبكة؟','طابعة USB تتصل مباشرة بحاسوب. أما طابعة الشبكة فلها اتصال شبكي ويمكن للأجهزة المصرح لها استخدامها.','قارن بين توصيل USB والطابعة المتصلة بالمحوّل.'],
'إدارة الراوتر وواي فاي آمن':['كيف نحمي الشبكة اللاسلكية؟','نقطة الوصول اللاسلكية تتيح للأجهزة الاتصال بالشبكة عبر Wi-Fi. استخدم كلمة مرور قوية وغيّر بيانات الإدارة الافتراضية.','ستغير إعدادات الشبكة ثم توصل جهازاً لاسلكياً.'],
'إصلاح الأعطال':['كيف تبدأ تشخيص مشكلة اتصال؟','ابدأ بالطبقة المادية: الطاقة والكبل والاتصال اللاسلكي. ثم تحقق من عنوان IP والقناع والبوابة، وبعدها استخدم Ping.','اتبع خطوات التشخيص واحدة تلو الأخرى ولا تغيّر كل الإعدادات دفعة واحدة.'],
'العناوين اليدوية وتعارض IP':['ما الذي يجعل إعداد IP صحيحاً؟','يجب أن يكون عنوان الجهاز فريداً، وأن يتوافق مع قناع الشبكة. وللوصول إلى شبكات أخرى، يحتاج الجهاز إلى بوابة افتراضية صحيحة.','ستصلح تعارض عنوان ومشكلة جهاز موجود في شبكة مختلفة.'],
'راوتران وشبكتان':['لماذا نحتاج إلى التوجيه؟','عندما تكون الأجهزة في شبكات IP مختلفة، تمر الحزم عبر راوتر يختار المسار التالي نحو الوجهة.','راقب انتقال الحزمة عبر الراوترين في هذا التمرين المبسط.']};

function doPing(){const d=d0(),raw=$('#pt').value.trim();if(!raw)return toast('اكتب ping أو ipconfig أو arp -a، أو عنوان IP الهدف');
