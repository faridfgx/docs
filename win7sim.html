<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windows Installation Simulator (7 / 8 / 10)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;height:100%;background:#000;font:14px/1.45 "Segoe UI",Tahoma,Arial,sans-serif;color:#1b1b1b;overflow:hidden}
#s{position:relative;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center}
button{font:inherit;padding:5px 18px;border:1px solid #707070;border-radius:3px;background:linear-gradient(#f2f2f2,#d9d9d9 50%,#cfcfcf);color:#111;cursor:pointer}
button:hover:not(:disabled){border-color:#3c7fb1}
button:disabled{color:#888;border-color:#aaa;cursor:default}
button.def{border-color:#3c7fb1}
button:focus-visible,input:focus-visible,select:focus-visible,.it:focus-visible,.mi:focus-visible{outline:2px solid #2a7fc9;outline-offset:2px}
input[type=text],input[type=password],select{font:inherit;padding:4px 6px;border:1px solid #8e8f8f;border-radius:2px;width:100%;max-width:340px}
/* prep + bios + dos */
.prep{background:#14202e;color:#e8eef5}
.card{width:min(620px,94vw);padding:24px}
.card h1{font-size:22px;font-weight:600;margin:0 0 4px}
.card p.sub{margin:0 0 18px;color:#9fb3c8}
.mini{height:6px;background:#2c4058;border-radius:3px;margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;width:0;background:#4aa3e8}
.bios{background:#0000a8;color:#c8c8ff;font:15px/1.5 "Courier New",monospace;align-items:flex-start;justify-content:flex-start;padding:20px 28px;flex-direction:column}
.bios h3{margin:0 0 10px;background:#a8a8a8;color:#0000a8;padding:0 8px;font-weight:400}
.bios .dev{padding:2px 10px;cursor:pointer;width:min(520px,100%)}
.bios .dev.on{background:#fff;color:#0000a8}
.bios button{font-family:inherit;margin:10px 8px 0 0;padding:2px 12px;border-radius:0;background:#a8a8a8;border-color:#fff}
.dos{background:#000;color:#ddd;font:16px/1.5 "Courier New",monospace;align-items:flex-start;justify-content:flex-start;padding:20px 28px;flex-direction:column;cursor:default}
.cur{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.load{background:#000;color:#fff;flex-direction:column;justify-content:flex-end;align-items:stretch;padding:0 0 12vh}
.load .t{text-align:center;font-size:17px;margin-bottom:16px}
.pb{height:16px;width:min(520px,80%);margin:0 auto;border:1px solid #7a8;background:#111;border-radius:2px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:linear-gradient(#9ee06a,#3da020)}
.pb.bl i{background:linear-gradient(#8fd1ff,#1f7fd0)}
.logo{background:#000;color:#fff;flex-direction:column;gap:14px}
.logo .w{font-size:30px;font-weight:300;letter-spacing:1px}
.logo .w b{font-weight:600}
.logo .sm{font-size:15px;opacity:.8}
.pulse{animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.07);filter:brightness(1.3)}}
/* setup dialog */
.setup{background:radial-gradient(ellipse at 30% 20%,#9ed3f2,#4a8fc8 45%,#1f4f8a)}
.dlg{width:min(820px,95vw);height:min(560px,90%);display:flex;flex-direction:column;background:#fff;border:1px solid #2b4a6e;border-radius:6px;box-shadow:0 12px 50px #0008;overflow:hidden}
.bar{padding:6px 12px;background:linear-gradient(#cfe5f7,#a9cdea);border-bottom:1px solid #7ea6c8;font-size:12px}
.pane{flex:1;padding:18px 28px;overflow:auto;background:#fff}
.pane h2{margin:0 0 12px;color:#003399;font-weight:400;font-size:20px}
.foot{padding:10px 16px;background:#f0f0f0;border-top:1px solid #ccc;display:flex;justify-content:flex-end;gap:8px}
.row{display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:center;margin:10px 0}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.big{text-align:center;padding:30px 0}
.big button{font-size:22px;padding:14px 30px;border-radius:8px}
.lic{border:1px solid #999;padding:10px;height:220px;overflow:auto;font-size:12.5px;background:#fafafa}
.opt{display:block;padding:10px 12px;border:1px solid transparent;margin:6px 0;cursor:pointer}
.opt:hover{background:#eaf4fc;border-color:#a8d4f0}
.opt b{display:block;color:#003399}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f4f4f4;text-align:left;padding:4px 8px;border:1px solid #ddd;font-weight:400}
td{padding:5px 8px;border-bottom:1px solid #eee;cursor:pointer}
tr.sel td{background:#cde8ff}
.link{color:#0645ad;cursor:pointer;text-decoration:underline}
.act{margin:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.warn{color:#b00020;margin-top:8px;min-height:20px}
.steps{list-style:none;padding:0;margin:20px 0}
.steps li{padding:5px 0;color:#888}
.steps li.on{color:#000;font-weight:600}
.steps li.ok{color:#000}
.steps li:before{content:"\25CB  "}
.steps li.ok:before{content:"\2713  ";color:#2a8a2a}
.steps li.on:before{content:"\25B6  ";color:#2a7fc9}
/* oobe */
.oobe{background:radial-gradient(ellipse at 50% 0,#d9f0fb,#7ec3ea 55%,#3d86c0)}
.oobe .dlg{background:rgba(255,255,255,.93);height:min(500px,90%);width:min(760px,95vw);border-color:#fff8}
.oobe .bar{display:none}
.oobe .foot{background:transparent;border:0}
.oobe .pane{background:transparent}
.oobe h2{color:#1a5a8a}
.welcome{background:radial-gradient(ellipse at 50% 40%,#3aa0e0,#0c3d86);color:#fff;font-size:44px;font-weight:300;flex-direction:column;gap:10px}
/* desktop (Aero style) */
.desk{background:url('img/win7.jpg') center/cover no-repeat,radial-gradient(ellipse 50% 35% at 72% 48%,#d8f6ff,#6cc4f4 40%,#0000 75%),linear-gradient(160deg,#2a8be0,#0a3f90 55%,#04204d);align-items:flex-start;justify-content:flex-start}
.ico{position:absolute;left:14px;width:76px;text-align:center;color:#fff;font-size:12px;text-shadow:0 1px 3px #000;cursor:pointer;user-select:none}
.ico span{display:block;font-size:38px}
.tb{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;background:linear-gradient(#ffffff66,#a9cbe944 12%,#2b5683aa 50%,#10294acc);backdrop-filter:blur(8px);border-top:1px solid #fffa;box-shadow:inset 0 1px 0 #fff6;color:#fff;font-size:12px;z-index:5}
.orb{width:46px;height:46px;margin:-8px 8px 0 8px;border-radius:50%;border:2px solid #cfe6f5;background:radial-gradient(circle at 50% 30%,#8fd0ff,#1b6fc2 60%,#0a3c7a);display:grid;place-items:center;padding:0}
.tb .pin{display:flex}
.tb .pin button,.tb .tbw{height:34px;min-width:46px;padding:0 8px;margin:0 2px;font-size:18px;color:#fff;background:linear-gradient(#ffffff38,#ffffff0a);border:1px solid #fff4;border-radius:4px}
.tb .pin button:hover,.tb .tbw:hover{background:linear-gradient(#ffffff66,#7ec4f255);border-color:#fff9}
.tb .tbw{display:none;align-items:center;gap:6px;font-size:12px}
.tray{margin-left:auto;display:flex;align-items:center;gap:10px;padding:0 4px 0 10px;font-size:12px}
#ck{text-align:center;line-height:1.2}
.tb .sd{width:14px;min-width:0;height:auto;align-self:stretch;margin-left:6px;padding:0;border:0;border-left:1px solid #fff8;border-radius:0;background:#ffffff22}
.tb .sd:hover{background:#ffffff66}
.start{position:absolute;display:none;left:4px;bottom:40px;width:min(400px,96vw);height:min(480px,calc(100% - 46px));padding:6px;gap:6px;background:linear-gradient(#7fb0dccc,#2a5788dd);backdrop-filter:blur(10px);border:1px solid #fffa;border-radius:8px 8px 0 0;box-shadow:0 0 0 1px #000a,0 -4px 24px #0009;color:#000;z-index:6}
.start.open{display:flex}
.start .l{flex:1.25;display:flex;flex-direction:column;background:#fff;border-radius:5px;padding:6px;overflow:auto}
.start .r{flex:1;display:flex;flex-direction:column;color:#fff;padding:2px;overflow:auto}
.start .l input{width:100%;max-width:none;margin-top:6px}
.start div.it{padding:8px;cursor:pointer;border-radius:3px}
.start .l .it:hover{background:#cde8ff}
.start .r .it:hover{background:#ffffff33}
.start .sep{height:1px;background:#0003;margin:4px 0}
.start .r .sep{background:#fff5}
.start .usr{display:flex;align-items:center;gap:10px;padding:4px 6px}
.start .av{width:44px;height:44px;border-radius:6px;border:2px solid #fff9;background:linear-gradient(135deg,#f6a52e,#e8602c);display:grid;place-items:center;font-size:26px}
.start .pw{margin-top:auto;position:relative;display:flex;gap:2px}
.start .pw .shut{flex:1;text-align:left;padding:6px 10px;color:#fff;background:linear-gradient(#5a6f89,#25354d);border:1px solid #0008;border-radius:4px 0 0 4px}
.start .pw .arr{padding:6px 10px;color:#fff;background:linear-gradient(#5a6f89,#25354d);border:1px solid #0008;border-radius:0 4px 4px 0}
.sdm{display:none;position:absolute;right:0;bottom:34px;width:100%;background:#fff;color:#000;border:1px solid #9bc;box-shadow:0 4px 12px #0008}
.sdm.open{display:block}
.sdm .it:hover{background:#cde8ff}
.win{position:absolute;left:12%;top:10%;width:min(520px,86vw);background:#fff;border:1px solid #fff9;border-radius:8px;box-shadow:0 0 0 1px #0007,0 10px 40px #000a;display:none;color:#000}
.win.open{display:block}
.win .bar{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#cfe5f7e6,#8db8e0e6);border-radius:7px 7px 0 0;padding:4px 6px 4px 12px}
.win .bar .wc{display:flex;gap:2px}
.win .bar button{padding:0 12px;height:20px;line-height:1;background:linear-gradient(#e3eef9,#b5cfe9);color:#234;border:1px solid #5b7fa3;border-radius:0 0 4px 4px}
.win .bar button.x{padding:0 18px;background:linear-gradient(#e9a69b,#c9483a 50%,#a82c1d);color:#fff;border-color:#6b1a10}
.win.min{display:none!important}
.win.max{left:0;top:0;width:100%;height:calc(100% - 40px);border-radius:0}
.drv{display:flex;gap:12px;padding:16px;align-items:center}
.drv .g{height:14px;background:#e6e6e6;border:1px solid #bbb;width:240px}
.drv .g i{display:block;height:100%;background:linear-gradient(#5fb4f0,#2078c8)}
.pick{background:#14202e;color:#e8eef5;flex-direction:column;gap:14px}
.pick h1{font-size:20px;font-weight:600;margin:0;text-align:center;line-height:1.7}
.pick button{width:min(300px,86vw);font-size:20px;padding:14px;background:#1b2b3d;color:#fff;border-color:#4aa3e8}
.pick button:hover:not(:disabled){background:#254463}
.prep{overflow:auto;align-items:flex-start}
.prep .card{margin:auto}
.dots{display:flex;gap:6px;margin-bottom:10px}
.dots i{width:28px;height:5px;border-radius:3px;background:#2c4058}
.dots i.on{background:#4aa3e8}
.dots i.ok{background:#3f8f5f}
.stp{font-size:12px;color:#7fb1e0;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;margin-top:18px}
.okt{text-align:center;color:#7fdc9f;font-weight:600}
.img{display:block;margin:8px auto;width:100%;max-width:340px}
.rufus{background:#f0f0f0;color:#111;border:1px solid #555;max-width:380px;margin:10px auto;font-size:12.5px}
.rufus .rb{background:#fff;padding:4px 8px;border-bottom:1px solid #aaa}
.rufus .rbd{padding:10px 12px}
.rufus label{display:block;margin-top:6px;color:#333}
.rufus .f{background:#fff;border:1px solid #888;padding:3px 6px}
.rufus select{max-width:none;border-radius:0;border-color:#888;padding:2px 4px}
.pbr{height:22px;border:1px solid #888;background:#e6e6e6;position:relative;margin:12px 0 8px}
.pbr i{display:block;height:100%;background:#06b025}
.pbr span{position:absolute;inset:0;text-align:center;font-size:12px;line-height:22px}
.kbw{margin-top:auto;align-self:center;padding-top:14px;max-width:100%}
.kb{display:flex;flex-direction:column;gap:4px;align-items:center;font-family:"Segoe UI",sans-serif;background:linear-gradient(#3a3d43,#1b1d21);border:2px solid #0b0c0e;border-radius:12px;padding:10px 12px 14px;box-shadow:0 5px 0 #0a0b0c,0 14px 24px #000a,inset 0 1px 0 #6a6f78}
.kb div{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.kb button.key{min-width:30px;padding:5px 7px;font-size:11px;border-radius:4px;background:linear-gradient(#4d525b,#33373e);color:#e6e9ee;border:1px solid #15171a;box-shadow:0 3px 0 #0f1012,inset 0 1px 0 #70767f}
.kb button.key.sp{min-width:130px}
.kb button.key.hl{background:#ffd23f;color:#000;border-color:#fff}
.kb button.key.any{background:#5a6b80;color:#fff}
.glow{fill:#ffd23f;stroke:#fff;stroke-width:2}
@media(prefers-reduced-motion:reduce){.pulse,.cur{animation:none}}
/* ===== Monitor frame ===== */
body{display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .5s}
#mon{position:relative;display:flex;flex:1;min-height:0;width:100%;height:auto;transition:all .5s ease}
#mon #s{flex:1;min-width:0;min-height:0;width:auto;height:auto}
#stand{display:none}
body.mon{background:radial-gradient(ellipse at 50% 30%,#2c313a,#0a0b0d)}
body.mon #mon{flex:none;width:min(94vw,calc((100dvh - 110px) * 1.6));height:auto;aspect-ratio:16/10;padding:12px 12px 26px;background:linear-gradient(145deg,#2a2c30,#0e0f11);border-radius:14px;box-shadow:0 0 0 2px #444,0 18px 50px #000c,inset 0 0 6px #000}
body.mon #mon #s{border-radius:3px;box-shadow:0 0 0 2px #000,0 0 30px #4aa3e855}
body.mon #mon::after{content:"";position:absolute;right:22px;bottom:9px;width:7px;height:7px;border-radius:50%;background:#3f8;box-shadow:0 0 6px #3f8}
body.mon #mon::before{content:"ALFATRON";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font:600 10px/1 Arial,sans-serif;letter-spacing:3px;color:#8a8f98}
body.mon #stand{display:block;width:90px;background:linear-gradient(90deg,#1a1b1d,#3a3c40,#1a1b1d);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);margin-top:-1px;position:relative;height:42px}
body.mon #stand:after{content:"";display:block;width:180px;height:8px;background:#222;position:absolute;left:50%;top:34px;transform:translateX(-50%);margin:0;border-radius:4px}
@media(max-width:560px){body.mon #mon{padding:6px 6px 16px;border-radius:8px}body.mon #stand{display:none}}
#kbc{display:none;width:100%;flex:none;justify-content:center;align-items:center;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 8px);background:#14202e;position:relative;z-index:100;pointer-events:auto}
body.hk #kbc{display:flex}
body.mon.hk #kbc{background:transparent}
body.mon.hk #mon{width:min(94vw,calc((100dvh - 300px) * 1.6))}
body.hk #stand{display:none}
#kbc .kbw{margin:0 auto;padding:0 8px;width:100%;display:flex;justify-content:center}
#kbc .kb{width:min(900px,96vw);margin:0 auto}
#kbc .kb div{width:100%;flex-wrap:nowrap}
#kbc button.key{cursor:pointer;pointer-events:auto;flex:1;min-width:0;padding:8px 2px;font-size:clamp(9px,1.3vw,12px)}
#kbc button.key.sp{flex:5}
@media(max-width:560px){#kbc .kb{padding:6px 5px 8px;border-radius:8px}#kbc .kb div{gap:2px}#kbc button.key{padding:7px 1px;font-size:9px}}
#s .kbw{display:none}
.toast{display:none;position:fixed;z-index:90;left:50%;top:calc(env(safe-area-inset-top,0px) + 50px);transform:translateX(-50%);width:80%;background:#fffbe6;color:#222;border:1px solid #c9a227;border-radius:10px;padding:16px 20px;font-size:22px;line-height:1.6;text-align:center;box-shadow:0 8px 30px #0008}
.toast button{margin-top:10px;font-size:20px}
.bios .tabs{display:flex;background:#a8a8a8;width:min(640px,100%);margin-bottom:12px;flex-wrap:wrap}
.bios .tabs span{padding:0 16px;color:#0000a8;cursor:pointer}
.bios .tabs span.on{background:#0000a8;color:#ffff55}
.bios .bf{display:flex;justify-content:space-between;width:min(600px,100%);padding:2px 10px}
.bios .bf b{font-weight:400;color:#fff}
.bios .bh{color:#ffff55;margin:10px 0 6px}
.bios .ft{margin-top:14px;color:#ffff55;font-size:13px}
.md{position:absolute;inset:0;z-index:80;background:#0006;display:flex;align-items:center;justify-content:center}
.mb{width:min(440px,90%);background:#fff;border:1px solid #2b4a6e;border-radius:6px;box-shadow:0 10px 40px #000a;color:#000;overflow:hidden}
.mb .bd{display:flex;gap:14px;padding:18px 20px;font-size:13.5px}
.mb .bt{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;background:#f0f0f0;border-top:1px solid #ccc}
.dos .dev{padding:2px 10px;cursor:pointer;width:min(420px,100%)}
.dos .dev.on{background:#ddd;color:#000}
.ch{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.ch button{width:200px;padding:12px;font-size:15px;background:#1b2b3d;color:#fff;border-color:#4aa3e8}
.ch button.on{background:#2a6db0;border-color:#fff}
#ctl{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:50;display:flex;gap:6px}
#ctl button{position:static;border-radius:14px;background:#fff;border-color:#2a7fc9;color:#0b4a8a;padding:3px 12px;white-space:nowrap}
body.paused *{animation-play-state:paused!important}
/* menu */
#mmenu{display:none;position:fixed;z-index:70;top:calc(env(safe-area-inset-top,0px) + 44px);right:10px;min-width:220px;background:#fff;color:#111;border:1px solid #2a7fc9;border-radius:8px;box-shadow:0 8px 30px #0008;overflow:hidden}
#mmenu.open{display:block}
#mmenu .mi{padding:9px 14px;cursor:pointer}
#mmenu .mi:hover{background:#cde8ff}
/* fixed BIOS frame */
.bios h3{width:min(640px,100%);box-sizing:border-box}
.bios .bbody{width:min(640px,100%);height:270px;box-sizing:border-box;border:1px solid #a8a8a8;padding:6px 0;overflow:hidden}
.bios .bbody .dev{width:100%;box-sizing:border-box}
.bios .bfoot{margin-top:auto;width:min(640px,100%);color:#ffff55;font-size:13px;border-top:1px solid #a8a8a8;padding-top:6px}
.bdlg{position:absolute;inset:0;z-index:80;background:#0005;display:flex;align-items:center;justify-content:center;font:15px/1.5 "Courier New",monospace}
.bbox{width:min(420px,90%);background:#a8a8a8;color:#000;border:2px solid #fff;box-shadow:6px 6px 0 #000}
.bbox .bttl{background:#0000a8;color:#ffff55;text-align:center}
.bbox p{margin:16px 12px;text-align:center}
.bbox .bbtn{display:flex;justify-content:center;gap:30px;padding-bottom:14px}
.bbox .bbtn span{padding:0 8px;cursor:pointer}
.bbox .bbtn span.on{background:#0000a8;color:#fff}
/* side progress bar */
#side{position:fixed;z-index:45;top:calc(env(safe-area-inset-top,0px) + 44px);bottom:0;right:0;width:min(260px,80vw);background:#0f1a27;color:#dbe8f5;border-left:1px solid #2c4058;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);overflow:auto;transform:translateX(100%);transition:transform .25s;font-size:13px;line-height:1.5}
#side.open{transform:none}
#side h4{margin:0 0 4px;font-size:15px;color:#7fb1e0}
#progressSummary{font-size:12px;color:#9fb3c8;margin-bottom:10px}
#sideList,#sideList ul{list-style:none;margin:0;padding:0}
#sideList>li{padding:7px 8px;border-bottom:1px solid #1e2f43;color:#7f93a8}
#sideList>li.done{color:#7fdc9f}
#sideList>li.cur{background:#17324f;color:#fff;font-weight:600;border-radius:4px}
#sideList .st{display:inline-block;width:18px}
#sideList ul{margin:6px 18px 2px 0;font-size:12.5px;font-weight:400}
#sideList ul li{padding:3px 0;color:#7f93a8}
#sideList ul li.done{color:#7fdc9f}
#sideList ul li.cur{color:#ffd23f;font-weight:600}
#sideList .note{display:block;font-size:12px;font-weight:400;color:#ffd23f;margin-right:18px}
body.sb{padding-right:260px}
body.sb.mon #mon{width:min(calc(94vw - 260px),calc((100dvh - 110px) * 1.6))}
body.sb.mon.hk #mon{width:min(calc(94vw - 260px),calc((100dvh - 300px) * 1.6))}
body.sb #kbc .kb{width:min(900px,calc(96vw - 260px))}
.mbi{flex:none;width:30px;height:30px;border-radius:50%;background:#2a7fc9;color:#fff;display:grid;place-items:center;font:700 18px sans-serif}

function vwin0(body, next, o={}) {

    const barTxt = K.ver=='10'?T('Windows 10 Setup','Installation de Windows 10'):K.ver=='8'?T('Windows 8 Setup','Installation de Windows 8'):T('Install Windows','Installer Windows');
    return `<div class="dlg ${cls}"><div class="bar">${barTxt}</div><div class="pane">${body}</div><div class="foot">${o.back ? `<button onclick='go("${o.back}")'>${T('Back','Précédent')}</button>` : ''}<button id="nx" class="def" onclick='${next}' ${o.dis ? 'disabled' : ''}>${o.label || T('Next','Suivant')}</button></div></div>`;
}

    disk: ["Pick where the system goes. Open “Drive options”, select the unallocated space and click New to create a partition (at least 20 GB; the rest can stay free). The setup adds its own small System Reserved partition: do not choose it. Select your big partition and click Next. Delete and Format erase data.", "Choisissez où installer le système. Ouvrez « Options de lecteur », sélectionnez l’espace non alloué et cliquez sur Nouveau pour créer une partition (au moins 20 Go ; le reste peut rester libre). L’installation ajoute sa propre petite partition Système réservé : ne la choisissez pas. Sélectionnez votre grande partition puis cliquez sur Suivant. Supprimer et Formater effacent les données.", "اختر مكان تثبيت النظام. افتح «خيارات القرص»، حدد المساحة غير المخصصة واضغط «جديد» لإنشاء قسم (20 غيغابايت على الأقل ويمكن ترك الباقي). يضيف المثبّت قسم «محجوز للنظام» صغيراً: لا تختره. حدد القسم الكبير ثم اضغط «التالي». الحذف والتهيئة يمسحان البيانات."],

/* ===== movable / closable / collapsible guide (free on the whole window, not only inside the virtual screen) ===== */
function placeGuide(d){
  const W=innerWidth,H=innerHeight,w=d.offsetWidth,h=d.offsetHeight;
  let x,y;
  if(K.gpos){x=K.gpos.x*W;y=K.gpos.y*H}
  else{const r=root.getBoundingClientRect();x=r.left+(r.width-w)/2;y=r.top+8}
  x=Math.max(0,Math.min(W-w,x));y=Math.max(0,Math.min(H-h,y));
  d.style.left=x+'px';d.style.top=y+'px';d.style.transform='none'
}
learn=function(){
  document.querySelectorAll('.guide').forEach(e=>e.remove());
  if(K.mode!='guided'||!K.ui)return;
  let t=(GDV[K.ver]&&GDV[K.ver][cur])||GD[cur];
  if(cur=='p2')t=K.med=='dvd'?(K.tool?GD.p2d:GD.p2n):GD.p2;
  if(!t)return;
  const d=document.createElement('div');
  d.className='guide'+(K.gmin?' min':'');d.dir='rtl';
  d.innerHTML=`<div class="gh"><span>💡 إرشاد</span><button class="gm" title="تصغير / تكبير" aria-label="تصغير">${K.gmin?'+':'–'}</button><button class="gx" title="إغلاق" aria-label="إغلاق الإرشاد">✕</button></div><div class="gb">${t}</div>`;
  document.body.appendChild(d);
  placeGuide(d);

  d.querySelector('.gx').onclick=()=>d.remove();
  d.querySelector('.gm').onclick=e=>{
    K.gmin=!K.gmin;d.classList.toggle('min',K.gmin);
    e.target.textContent=K.gmin?'+':'–';
    placeGuide(d)
  };
  /* double-click the header: back to the default place */
  d.querySelector('.gh').ondblclick=e=>{if(e.target.closest('button'))return;K.gpos=null;placeGuide(d)};

  /* drag anywhere in the window (mouse + touch) */
  d.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    const r=d.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;
    d.setPointerCapture(e.pointerId);d.classList.add('drag');
    const mv=ev=>{
      d.style.left=Math.max(0,Math.min(innerWidth-d.offsetWidth,ev.clientX-dx))+'px';
      d.style.top=Math.max(0,Math.min(innerHeight-d.offsetHeight,ev.clientY-dy))+'px';
      d.style.transform='none'
    };
    const up=()=>{
      d.classList.remove('drag');
      d.removeEventListener('pointermove',mv);d.removeEventListener('pointerup',up);d.removeEventListener('pointercancel',up);
      K.gpos={x:parseFloat(d.style.left)/innerWidth,y:parseFloat(d.style.top)/innerHeight}
    };
    d.addEventListener('pointermove',mv);d.addEventListener('pointerup',up);d.addEventListener('pointercancel',up)
  });

  /* auto-fade after 20 s, but never while hovered, dragged or collapsed */
  const fade=()=>{
    if(!d.isConnected)return;
    if(K.gmin||d.classList.contains('drag')||d.matches(':hover')){later(fade,3000);return}
    d.classList.add('off');later(()=>d.remove(),700)
  };
  later(fade,20000)
};

const gkey=n=>[...document.querySelectorAll('#kbc .key')].find(k=>k.getAttribute('aria-label')==n);
/* returns [element | [elements], label] or null */
function gTarget(){
  if(K.mode!='guided'||!K.ui)return null;
  const R=s=>root.querySelector(s),RA=s=>[...root.querySelectorAll(s)];
  const CLICK='اضغط هنا',PICK='اختر هذا',TICK='ضع علامة هنا',TYPE='اكتب هنا';
  /* 1. an open message box (Windows or BIOS): point at its OK button */
  const md=R('.md button.def')||R('.md button')||R('.bdlg .bbtn span');
  if(md)return[md,CLICK];
  /* nothing to point at while something is downloading / copying / inserting */
  if(busy)return null;
  /* 2. BIOS / boot menu / POST */
  if(cur=='post'){
    if(K.stage||bootOK())return null;               /* boot order already right: just wait */
    const ks=['F2','Del','F12'].map(gkey).filter(gvis);
    return ks.length?[ks,'اضغط F2 أو Del أو F12 (أي واحد منها)']:null
  }
  if(cur=='pak'){
    if(K.stage)return null;
    const kb=document.querySelector('#kbc .kb');
    return gvis(kb)?[kb,'اضغط أي زر في لوحة المفاتيح']:null
  }
  if(cur=='bmenu'){
    const i=mediaIdx(),row=RA('.dev')[i];
    return row?[row,'اختر وسيط التثبيت (USB / DVD)']:null
  }
  if(cur=='bios'){
    const t=K.bt||0,tabs=RA('.bios .tabs span'),devs=RA('.bios .bbody .dev');
    if(bootOK()){
      const t2=[];const f10=gkey('F10');if(gvis(f10))t2.push(f10);
      if(t==4){if(devs[0])t2.push(devs[0])}else if(tabs[4])t2.push(tabs[4]);
      return t2.length?[t2,'الترتيب صحيح: احفظ واخرج (F10)']:null
    }
    if(t!=3)return tabs[3]?[tabs[3],'اضغط على Boot']:null;
    const i=mediaIdx(),row=devs[i],plus=gkey('+');
    const msg='رتّب الإقلاع ليكون وسيط التثبيت (USB / DVD) في المرتبة الأولى';
    if(K.sel!=i)return row?[row,msg]:null;
    return[[row,plus].filter(gvis),msg+' — اضغط +']
  }
  /* 3. a highlighted key of the on-screen keyboard */
  const key=document.querySelector('#kbc .key.hl');
  if(gvis(key))return[key,'اضغط هذا الزر'];
  const nx=R('#nx'),nxOn=nx&&!nx.disabled&&gvis(nx);
  /* 4. screens that need something special */
  if(cur=='p1'){
    if(!K.verSet){const vb=RA('.card button').filter(b=>/chooseVer/.test(b.getAttribute('onclick')||''));return vb.length?[vb,'اختر الإصدار الذي تريد تثبيته']:null}
    if(K.iso&&!K.med){const ch=RA('.ch button');return ch.length?[ch,'اختر واحداً من الاثنين']:null}
  }
  if(cur=='key'){const sk=RA('.link').find(l=>/skipKey/.test(l.getAttribute('onclick')||''));if(sk)return[sk,CLICK]}
  if(cur=='ms'){const l=RA('.link').find(l=>/nxo\('ms'\)/.test(l.getAttribute('onclick')||''));if(l)return[l,CLICK]}
  if(cur=='edi'){const rows=RA('table tr').slice(1);if(rows.length&&!R('table tr.sel'))return[rows,'اختر الإصدار الذي يطابق مفتاحك']}
  if(cur=='disk'){
    const P=K.parts,hasP=P.some(p=>p.k=='p'),row=i=>RA('#dl tr')[i+1];
    if(R('#sz')){const a=RA('#ac button')[0];if(a)return[a,CLICK]}
    if(!hasP){
      if(!K.adv){const l=R('#ac .link');return l?[l,CLICK]:null}
      const nb=RA('#ac button').find(b=>/newP/.test(b.getAttribute('onclick')||''));
      if(nb&&!nb.disabled)return[nb,CLICK];
      const u=P.findIndex(p=>p.k=='u');
      return u>=0&&row(u)?[row(u),PICK]:null
    }
    if(P[K.ps]&&P[K.ps].k!='p'){const i=P.findIndex(p=>p.k=='p');if(row(i))return[row(i),PICK]}
    return nxOn?[nx,CLICK]:null
  }
  if(cur=='type'){
    const o=RA('.opt').find(e=>/go\("disk"\)/.test(e.getAttribute('onclick')||''));
    if(o)return[o,PICK]
  }
  if(cur=='lic'){const c=R('input[type=checkbox]:not(:checked)');if(c)return[c,TICK]}
  if(cur=='o1'||cur=='acc'){const u=R('#u');if(u&&!u.value)return[u,TYPE]}
  if(cur=='login'){const l=R('#lp');if(gvis(l))return[l,TYPE]}
  /* 5. generic: the Next button when it is ready */
  if(nxOn)return[nx,CLICK];
  /* 6. Next is disabled: show what is still missing */
  if(nx&&nx.disabled){
    const c=R('input[type=checkbox]:not(:checked)');if(c)return[c,TICK];
    const rows=RA('table tr:not(.sel)').slice(1);if(rows.length)return[rows,PICK];
    const o=R('.opt');if(o)return[o,PICK];
    const i=RA('input[type=text],input[type=password]').find(x=>!x.value&&!x.disabled&&gvis(x));if(i)return[i,TYPE]
  }
  /* 7. screens with a single obvious button (only an enabled one) */
  const b=['.big button','.rufus .def','.nav .def','.foot .def'].map(R).find(x=>x&&gvis(x)&&!x.disabled);
  if(b)return[b,CLICK];
  const only=RA('.card button:not(:disabled)').filter(x=>!x.closest('.nav'));
  if(only.length==1)return[only[0],CLICK];
  const opts=RA('.opt');
  if(opts.length&&!nx)return[opts[0],PICK];
  return null
}
function gUpdate(){
  let t=null;try{t=gTarget()}catch(_){}
  const els=t?[].concat(t[0]).filter(gvis):[];
  if(!els.length){GP.style.display='none';return}
  /* adjacent targets share ONE container */
  const GAP=24;
  let groups=els.map(e=>{const r=e.getBoundingClientRect();return{l:r.left,t:r.top,r:r.right,b:r.bottom}});
  const near=(a,b)=>a.l-GAP<=b.r&&b.l-GAP<=a.r&&a.t-GAP<=b.b&&b.t-GAP<=a.b;
  for(let ch=true;ch;){ch=false;
    outer:for(let i=0;i<groups.length;i++)for(let j=i+1;j<groups.length;j++)if(near(groups[i],groups[j])){
      const a=groups[i],b=groups[j];groups.splice(j,1);
      groups[i]={l:Math.min(a.l,b.l),t:Math.min(a.t,b.t),r:Math.max(a.r,b.r),b:Math.max(a.b,b.b)};ch=true;break outer}}
  GP.style.display='block';
  while(GP.children.length<groups.length){const g=document.createElement('div');g.className='gp';g.innerHTML='<div class="ring"></div><div class="lab"></div>';GP.appendChild(g)}
  while(GP.children.length>groups.length)GP.lastChild.remove();
  groups.forEach((r,i)=>{
    const g=GP.children[i];
    g.style.left=(r.l-4)+'px';g.style.top=(r.t-4)+'px';
    g.style.width=(r.r-r.l+8)+'px';g.style.height=(r.b-r.t+8)+'px';
    g.classList.toggle('dn',r.t<48);g.classList.toggle('up',r.t>=48);
    g.classList.toggle('nolab',i>0);
    if(i==0)g.lastChild.textContent=t[1]
  })
}
setInterval(gUpdate,200);
addEventListener('resize',gUpdate);

go('pick');
</script>
